[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E2E8F0"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "small"
borderColor = "#1F2A44"
showWidgetBorder = true

[server]
maxUploadSize = 50
# security: keep Streamlit's request-forgery and cross-origin protections explicitly on
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# never show stack traces or internal details to visitors
showErrorDetails = "none"
